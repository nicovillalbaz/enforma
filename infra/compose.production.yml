services:
  db:
    ports: !reset []
    restart: unless-stopped
  api:
    environment:
      NODE_ENV: production
      APP_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
      # Exact immediate peer; the API port must remain unpublished.
      TRUSTED_PROXY_IP: ${CADDY_PROXY_IP:-172.30.14.2}
    networks:
      default: {}
      edge: {}
    restart: unless-stopped
  worker:
    environment:
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    restart: unless-stopped
  media:
    restart: unless-stopped
  followup:
    restart: unless-stopped
  documents:
    restart: unless-stopped
  web:
    networks:
      edge:
        ipv4_address: ${CADDY_PROXY_IP:-172.30.14.2}
    ports: !override ['80:80', '443:443', '443:443/udp']
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./infra/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
  mailpit:
    profiles: ['local-mail']
    ports: !reset []
  backup:
    restart: on-failure
volumes:
  caddy_data:
  caddy_config:
networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.30.14.0/29}
